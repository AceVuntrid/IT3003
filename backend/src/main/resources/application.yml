spring:
  application:
    name: university-asset-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/uniassets}
    username: ${DB_USERNAME:uniassets}
    password: ${DB_PASSWORD:uniassets}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}
  # Honor X-Forwarded-* from the nginx reverse proxy so requests arriving via a
  # public hostname (tunnel, load balancer) are recognized as same-origin.
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-0123456789-0123456789-0123456789}
    access-expiry-minutes: ${JWT_ACCESS_EXPIRY:30}
    refresh-expiry-days: ${JWT_REFRESH_EXPIRY:14}
  cors:
    allowed-origins: ${APP_FRONTEND_URL:http://localhost:5173}
  storage:
    type: ${STORAGE_TYPE:local}
    path: ${STORAGE_PATH:./uploads}
  security:
    failed-login-limit: 5
    lock-minutes: 15
  seed:
    admin-email: ${ADMIN_EMAIL:admin@university.local}
    admin-password: ${ADMIN_PASSWORD:Admin@1234}
    demo-data: ${SEED_DEMO_DATA:true}
  reservation:
    overdue-penalty-per-day: ${OVERDUE_PENALTY_PER_DAY:5.00}
